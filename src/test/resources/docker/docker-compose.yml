    ports:
      - "33076:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: LbRootPass1
      MYSQL_DATABASE: lbcat
      MYSQL_USER: lbuser
      MYSQL_PASSWORD: LiquibasePass1
    volumes:
      - "./mariadb-init.sql:/docker-entrypoint-initdb.d/mariadb-init.sql"

  mssql-2017:
    container_name: sql-server-db-2017
    image: mcr.microsoft.com/mssql/server:2017-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "LiquibasePass1"
      ACCEPT_EULA: "Y"
    volumes:
      - "./mssql-init.sh:/docker-entrypoint-initdb.d/mssql-init.sh"
      - "./mssql-init.sql:/docker-entrypoint-initdb.d/mssql-init.sql"
    entrypoint: /bin/bash /docker-entrypoint-initdb.d/mssql-init.sh
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mssql-2019:
    container_name: sql-server-db-2019
    image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
    ports:
      - "1434:1433"
    environment:
      SA_PASSWORD: "LiquibasePass1"
      ACCEPT_EULA: "Y"
    volumes:
      - "./mssql-init.sh:/docker-entrypoint-initdb.d/mssql-init.sh"
      - "./mssql-init.sql:/docker-entrypoint-initdb.d/mssql-init.sql"
    entrypoint: /bin/bash /docker-entrypoint-initdb.d/mssql-init.sh
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mssql-2022:
    container_name: sql-server-db-2022
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    ports:
      - "1435:1433"
    environment:
      SA_PASSWORD: "LiquibasePass1"
      ACCEPT_EULA: "Y"
    volumes:
      - "./mssql-init.sh:/docker-entrypoint-initdb.d/mssql-init.sh"
      - "./mssql-init.sql:/docker-entrypoint-initdb.d/mssql-init.sql"
    entrypoint: /bin/bash /docker-entrypoint-initdb.d/mssql-init.sh
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mssql-2025:
    container_name: sql-server-db-2025
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - "1436:1433"
    environment:
      SA_PASSWORD: "LiquibasePass1"
      ACCEPT_EULA: "Y"
    volumes:
      - "./mssql-init.sh:/docker-entrypoint-initdb.d/mssql-init.sh"
      - "./mssql-init.sql:/docker-entrypoint-initdb.d/mssql-init.sql"
    entrypoint: /bin/bash /docker-entrypoint-initdb.d/mssql-init.sh
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  db2-luw:
    image: taskana/db2:11.5
    environment:
      LICENSE: "accept"
    ports:
      - "50000:50000"

  crdb-25.2:
    image: cockroachdb/cockroach:v25.2.28
    command: start-single-node --insecure
    expose:
      - "8080"
      - "26257"
    ports:
      - "26264:26257"
      - "8083:8080"
    networks:
      - roachnet

  crdb-25.2-init:
    image: cockroachdb/cockroach:v25.2.28
    networks:
      - roachnet
    volumes:
      - ./setup_db.sh:/setup_db.sh
    entrypoint: "/bin/bash"
    command: /setup_db.sh crdb-25.2 --insecure
    depends_on:
      - crdb-25.2

  crdb-25.4:
    image: cockroachdb/cockroach:v25.4.20
    command: start-single-node --insecure
    expose:
      - "8080"
      - "26257"
    ports:
      - "26265:26257"
      - "8084:8080"
    networks:
      - roachnet

  crdb-25.4-init:
    image: cockroachdb/cockroach:v25.4.20
    networks:
      - roachnet
    volumes:
      - ./setup_db.sh:/setup_db.sh
    entrypoint: "/bin/bash"
    command: /setup_db.sh crdb-25.4 --insecure
    depends_on:
      - crdb-25.4

  crdb-26.2:
    image: cockroachdb/cockroach:v26.2.11
    command: start-single-node --insecure
    expose:
      - "8080"
      - "26257"
    ports:
      - "26266:26257"
      - "8085:8080"
    networks:
      - roachnet

  crdb-26.2-init:
    image: cockroachdb/cockroach:v26.2.11
    networks:
      - roachnet
    volumes:
      - ./setup_db.sh:/setup_db.sh
    entrypoint: "/bin/bash"
    command: /setup_db.sh crdb-26.2 --insecure
    depends_on:
      - crdb-26.2

  informix-12.10:
    image: ibmcom/informix-developer-database:12.10.FC12W1DE
    container_name: informix-db-12
    hostname: ifx
    ports:
      - "9088:9088"
    environment:
      LICENSE: "accept"
      INIT_FILE: "sch_init_informix.custom.sql"
      SIZE: "custom"
    restart: always
    privileged: true
    volumes:
      - "./informix-init.sql:/opt/ibm/data/sch_init_informix.custom.sql"

  informix-14.10:
    image: icr.io/informix/informix-developer-database:14.10.FC7W1DE
    container_name: informix-db-14
    hostname: ifx
    ports:
      - "9089:9088"
    environment:
      LICENSE: "accept"
      INIT_FILE: "informix-init.sql"
      DBDATE: "Y4MD-"
    restart: always
    privileged: true
    volumes:
      - "./informix-init.sql:/opt/ibm/config/informix-init.sql"

  ti-db:
    image: pingcap/tidb
    container_name: ti-db
    ports:
      - 4000:4000
    volumes:
      - ./storage/tidb:/var/lib/mysql

  tidb:
    image: mysql:8.4
    container_name: mysql-client
    depends_on:
      - ti-db
    volumes:
      - ./tidb-init.sql:/tidb-init.sql
    entrypoint: sh -c "
      echo 'Waiting for TiDB to be ready...' &&
      sleep 5;
      echo 'TiDB is ready. Running initialization script...' &&
      mysql -h ti-db -P 4000 -u root < /tidb-init.sql &&
      echo 'Initialization complete.' &&
      tail -f /dev/null" Keeps the container running for interactive use
    network_mode: "service:ti-db"

  # Warning! Remap ports here and in harness-config.yml if you want to run two versions of these platforms simultaneously

  hsqldb-2.5:
    build:
      context: ./Dockerfiles/hsqldb
      args:
        HSQLDB_USER: lbuser
        HSQLDB_PASSWORD: LiquibasePass1
        HSQLDB_VERSION: 2.5.1
        HSQLDB_DATABASE_ALIAS: lbcat
    ports:
      - "9001:9001"

  hsqldb-2.6:
    build:
      context: ./Dockerfiles/hsqldb
      args:
        HSQLDB_USER: lbuser
        HSQLDB_PASSWORD: LiquibasePass1
        HSQLDB_VERSION: 2.6.1
        HSQLDB_DATABASE_ALIAS: lbcat
    ports:
      - "9002:9001"

  hsqldb-2.7:
    build:
      context: ./Dockerfiles/hsqldb
      args:
        HSQLDB_USER: lbuser
        HSQLDB_PASSWORD: LiquibasePass1
        HSQLDB_VERSION: 2.7.4
        HSQLDB_DATABASE_ALIAS: lbcat
    ports:
      - "9003:9001"

  # Warning! Remap ports here and in harness-config.yml if you want to run two versions of these platforms simultaneously

  firebird-3:
    image: firebirdsql/firebird:3.0.9
    ports:
      - "3050:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: LbRootPass1
      FIREBIRD_DATABASE: lbcat
      FIREBIRD_USER: lbuser
      FIREBIRD_PASSWORD: LiquibasePass1
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - "./firebird-init.sql:/docker-entrypoint-initdb.d/firebird-init.sql"

  firebird-4:
    image: firebirdsql/firebird:4.0.5
    ports:
      - "3051:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: LbRootPass1
      FIREBIRD_DATABASE: lbcat
      FIREBIRD_USER: lbuser
      FIREBIRD_PASSWORD: LiquibasePass1
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - "./firebird-init.sql:/docker-entrypoint-initdb.d/firebird-init.sql"

  firebird-5:
    image: firebirdsql/firebird:5.0.4
    ports:
      - "3052:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: LbRootPass1
      FIREBIRD_DATABASE: lbcat
      FIREBIRD_USER: lbuser
      FIREBIRD_PASSWORD: LiquibasePass1
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
