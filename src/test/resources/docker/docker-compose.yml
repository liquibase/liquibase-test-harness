services:
  mysql-8.4:
    platform: linux/x86_64
    image: mysql:8.4
    ports:
      - "33065:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: LbRootPass1
      MYSQL_DATABASE: lbcat
      MYSQL_USER: lbuser
      MYSQL_PASSWORD: LiquibasePass1
    volumes:
      - "./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql"

  mysql-9.7:
    platform: linux/x86_64
    image: mysql:9.7
    ports:
      - "33077:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: LbRootPass1
      MYSQL_DATABASE: lbcat
      MYSQL_USER: lbuser
      MYSQL_PASSWORD: LiquibasePass1
    volumes:
      - "./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql"

  percona-xtradb-cluster-8.4:
    image: percona/percona-xtradb-cluster:8.4
    ports:
      - "33072:3306"
    networks:
      - cluster1_net
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: LbRootPass1
      MYSQL_DATABASE: lbcat
      MYSQL_USER: lbuser
      MYSQL_PASSWORD: LiquibasePass1
      CLUSTER_NAME: cluster1
    volumes:
      - "./percona-xtradb-cluster-init.sql:/docker-entrypoint-initdb.d/percona-xtradb-cluster-init.sql"

  percona-xtradb-cluster-9.7:
    image: percona/percona-xtradb-cluster:9.7
