name: 'Read vault group'
description: 'Assume a grouped vault role and export /vault/grouped/<group> (or only the listed keys) to the job environment'
inputs:
  role-arn:
    description: 'The group role, e.g. secrets.VAULT_GROUPED_PRO_LICENSE_ROLE_ARN'
    required: true
  group:
    description: 'Group name; reads /vault/grouped/<group>'
    required: true
  keys:
    description: 'Space-separated keys to export; empty exports the whole group'
    required: false
    default: ''
  aws-region:
    description: 'AWS region of the vault'
    required: false
    default: 'us-east-1'
runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials for ${{ inputs.group }}
      uses: liquibase/build-logic/.github/actions/configure-aws-credentials@5e72097ceac12e1cc70fa6306e9d39f1b9bf1334 # main
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Get ${{ inputs.group }} from vault
      if: inputs.keys == ''
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
      with:
        secret-ids: |
          ,/vault/grouped/${{ inputs.group }}
        parse-json-secrets: true

    # Subset read: the group also holds keys this job must not get.
    - name: Get ${{ inputs.keys }} from vault
      if: inputs.keys != ''
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        KEYS: ${{ inputs.keys }}
      run: |
        set -euo pipefail
        vault_json="$(aws secretsmanager get-secret-value \
          --secret-id "/vault/grouped/${GROUP}" \
          --query SecretString --output text)"
        for key in ${KEYS}; do
          value="$(jq -r --arg k "$key" '.[$k] // empty | strings' <<< "$vault_json")"
          if [ -z "$value" ]; then
            echo "::error::/vault/grouped/${GROUP} has no string value for $key"
            exit 1
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              # The runner unescapes %25 and %0D before matching a mask, so escape % first.
              line="${line//'%'/%25}"
              echo "::add-mask::${line//$'\r'/%0D}"
            fi
          done <<< "$value"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            printf '%s<<%s\n' "$key" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
        done
